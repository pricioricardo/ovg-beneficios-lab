services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ovg_beneficios_lab}
      DB_USERNAME: ${DB_USERNAME:-ovg}
      DB_PASSWORD: ${DB_PASSWORD:-ovg_local}
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    command: ["/usr/local/bin/docker-entrypoint.sh"]
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ovg_beneficios_lab}
      MYSQL_USER: ${DB_USERNAME:-ovg}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ovg_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
  vendor_data:
